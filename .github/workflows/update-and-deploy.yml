name: تحديث أسعار الذهب ونشر الموقع
on:
  schedule:
    - cron: "0 12 * * *" # 3:00 PM Kuwait time (UTC+3)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4
      - name: إعداد بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: تثبيت المتطلبات
        run: pip install requests beautifulsoup4
      - name: تسجيل السعر الرسمي
        run: python scripts/update_prices.py
      - name: حفظ السجل اليومي
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "تحديث أسعار الذهب الرسمية"
          git push
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: جلب أحدث نسخة بعد تحديث الأسعار
        uses: actions/checkout@v4
        with:
          ref: main
      - name: إعداد صفحات GitHub
        uses: actions/configure-pages@v5
      - name: تجهيز ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: نشر الموقع
        id: deployment
        uses: actions/deploy-pages@v4
